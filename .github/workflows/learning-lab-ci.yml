name: Learning lab checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install pytest
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<9'

      - name: Compile Python tools and tests
        run: python -m compileall -q tools tests

      - name: Run repository contract tests
        run: python -m pytest -q

      - name: Run Repo Doctor against this repository
        run: python tools/repo_doctor.py --json > /tmp/repo-doctor.json

      - name: Verify public reference artifacts
        shell: bash
        run: |
          set -euo pipefail
          for f in README.md START-HERE.md docs/REPO-DOCTOR.md exercises/01-first-branch.md tools/repo_doctor.py; do
            test -s "$f" || { echo "Missing required artifact: $f" >&2; exit 1; }
          done
